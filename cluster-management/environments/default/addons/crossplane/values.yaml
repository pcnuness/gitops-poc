# Imagem e política de pull
image:
  pullPolicy: Always

# Quantidade de réplicas do pod Crossplane
replicas: 2
resourcesCrossplane:
  limits:
    cpu: "100m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"

rbacManager:
  replicas: 2
resourcesRBACManager:
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "200m"
    memory: "256Mi"

provider:
  packages:
    - xpkg.upbound.io/upbound/provider-aws-s3:v1.23.1
args:
  - "--registry=registry.upbound.io"
  - "--enable-realtime-compositions"
  - "--enable-deployment-runtime-configs"
  - "--enable-composition-webhook-schema-validation"
logLevel: debug
podLabels:
  app.kubernetes.io/managed-by: "gitops.plataform.com"
## Desativa webhooks (útil em clusters restritos)
#webhooks:
#  enabled: true
## Desativa os recursos de métrica (opcional)
#metrics:
#  enabled: false
# Pacotes a serem instalados automaticamente

#configuration:
#  packages:
